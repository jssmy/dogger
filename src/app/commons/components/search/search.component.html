<div class="retro-search">

    <div class="retro-search__bar" [class.retro-search__bar--open]="touched && value">
        <span class="retro-search__prompt content-low">$</span>
        <input
            type="text"
            #inputSearch
            class="retro-search__input content-low"
            (input)="writeValue(inputSearch.value)"
            (change)="onChangedValue(inputSearch.value)"
            (focus)="onFocusEvent()"
            [disabled]="disabled"
            [value]="value"
            [placeholder]="placeHolder">
        <button
            class="retro-search__btn"
            aria-label="presione para buscar"
            (click)="onSearchEvent()"
            [disabled]="disabled">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
            </svg>
        </button>
    </div>

    @if (touched && value) {
    <div class="retro-search__results">
        @for (item of items; track item.id) {
        <button
            type="button"
            class="retro-search__result-item content-low"
            (click)="selectedEvent.emit(item)"
            (keyup.enter)="selectedEvent.emit(item)">
            <span class="retro-search__arrow">→</span>
            <span class="retro-search__result-text">{{ item.value }}</span>
        </button>
        } @empty {
        <div class="retro-search__empty content-low">
            <span class="retro-search__excl">!</span> No se encontraron resultados
        </div>
        }
    </div>
    }

</div>
